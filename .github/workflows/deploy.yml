name: GitHub Pages → redirige a www.serviexpress.app

# La web oficial ahora vive en Vercel (www.serviexpress.app).
# Este flujo ya NO compila Flutter: publica solo páginas que redirigen
# databasesvm.github.io/serviexpressweb/<ruta> → www.serviexpress.app/<ruta>
# y un service worker que limpia la app vieja guardada en los teléfonos.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redirigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar redirección en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redireccion_github
          force_orphan: true

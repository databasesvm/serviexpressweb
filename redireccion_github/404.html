<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ServiExpress se mudó</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.serviexpress.app/">
  <script>
    // databasesvm.github.io/serviexpressweb/<ruta> → www.serviexpress.app/<ruta>
    // (conserva la ruta, p. ej. /form/, y los parámetros ?...#...)
    (function () {
      var ruta = location.pathname.replace(/^\/serviexpressweb/i, '') || '/';
      location.replace('https://www.serviexpress.app' + ruta + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://www.serviexpress.app/">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#0D0D0D;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
    a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:14px;background:#3AF500;
      color:#000;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <div>
    <h1 style="font-size:22px;margin:0 0 8px">ServiExpress ahora está en serviexpress.app</h1>
    <p style="opacity:.75;margin:0">Te llevamos a la nueva dirección…</p>
    <a href="https://www.serviexpress.app/">Ir a serviexpress.app</a>
  </div>
</body>
</html>

  <!-- ═══ ONESIGNAL WEB SDK ════════════════════════════════════════════════
       Notificaciones push en navegadores y PWA instaladas.
       En iPhone: requiere iOS 16.4+ y que la app esté instalada como PWA.
  ════════════════════════════════════════════════════════════════════════ -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer=""></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    // La web vive en una subcarpeta (/serviexpressweb/ y /serviexpressweb/form/).
    // El service worker de OneSignal se registra DENTRO de esa carpeta y con
    // un alcance propio (push/onesignal/) para no chocar con el de Flutter.
    (function () {
      var base = new URL('.', document.baseURI).pathname;      // ej: /serviexpressweb/form/
      var rel = base.replace(/^\//, '');                        // ej: serviexpressweb/form/
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "207d1d0a-0218-46e0-9f35-7d8d88f6765a",
          serviceWorkerPath: rel + "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: base + "push/onesignal/" },
          promptOptions: {
            slidedown: { prompts: [] }
          },
          notifyButton: { enable: false },
          allowLocalhostAsSecureOrigin: true,
        });
      });
    })();

    // ── Puentes que llama la app (Dart) ─────────────────────────────────
    // Pedir permiso de notificaciones (debe venir de un toque del usuario).
    window.sePushPermiso = function () {
      OneSignalDeferred.push(async function (OS) {
        try { await OS.Notifications.requestPermission(); } catch (e) {}
      });
    };
    // Identificar al cliente registrado (mismo id que en la app).
    window.sePushLogin = function (id) {
      OneSignalDeferred.push(async function (OS) {
        try { await OS.login(String(id)); } catch (e) {}
      });
    };
    // Marcar el pedido del invitado (no tiene cuenta) para avisarle a él.
    window.sePushTag = function (k, v) {
      OneSignalDeferred.push(async function (OS) {
        try { OS.User.addTag(String(k), String(v)); } catch (e) {}
      });
    };
  </script>

<body>

  <!-- ═══ BANNER DE INSTALACIÓN iOS ════════════════════════════════════════
       Solo visible en Safari iPhone/iPad cuando la app NO está instalada.
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="ios-install-banner" role="dialog" aria-label="Instalar ServiExpress" style="display:none">
    <button class="b-close" onclick="dismissIosBanner()" aria-label="Cerrar">✕</button>
    <div class="b-title">📲 Instala ServiExpress en tu iPhone</div>
    <div class="b-sub">Para recibir notificaciones de servicios y usarla como app nativa</div>
    <div class="b-step">
      <span class="ico">1️⃣</span>
      <span>Toca el botón <strong>Compartir</strong> ⬆️ en la barra inferior de Safari</span>
    </div>
    <div class="b-step">
      <span class="ico">2️⃣</span>
      <span>Desliza y selecciona <strong>"Agregar a pantalla de inicio"</strong></span>
    </div>
    <div class="b-step">
      <span class="ico">3️⃣</span>
      <span>Toca <strong>"Agregar"</strong> — abre la app desde tu pantalla de inicio y listo ✅</span>
    </div>
  </div>

  <script>
    // Mostrar banner solo en Safari de iOS y solo si no está instalada como PWA
    (function() {
      var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      var isSafari = /safari/i.test(navigator.userAgent) &&
                     !/chrome|crios|fxios|opios|gsa/i.test(navigator.userAgent);
      var isInstalled = window.navigator.standalone === true;
      var dismissed = sessionStorage.getItem('ios_banner_dismissed');
      if (isIos && isSafari && !isInstalled && !dismissed) {
        setTimeout(function() {
          var b = document.getElementById('ios-install-banner');
          if (b) b.style.display = 'block';
        }, 3500);
      }
    })();

    function dismissIosBanner() {
      var b = document.getElementById('ios-install-banner');
      if (b) b.style.display = 'none';
      sessionStorage.setItem('ios_banner_dismissed', '1');
    }
  </script>

  <!-- ═══ FORCE SERVICE WORKER UPDATE ════════════════════════════════════
       Fuerza al navegador a activar el SW nuevo en cada visita.
       Soluciona el render roto al desplegar una nueva versión en GitHub Pages.
  ════════════════════════════════════════════════════════════════════════ -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) {
          r.update().then(function() {
            if (r.waiting) {
              r.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        }
      });
      // Recargar UNA sola vez por cambio de versión (antes podía recargar en
      // bucle — p. ej. cuando el service worker de OneSignal toma el control —
      // y la app se quedaba en el logo).
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (sessionStorage.getItem('sw_recargado')) return;
        sessionStorage.setItem('sw_recargado', '1');
        window.location.reload();
      });
    }

    // Respaldo: si a los 25 s la app todavía no arrancó (conexión lenta o
    // descarga atascada), mostrar un botón para recargar en vez del logo fijo.
    setTimeout(function() {
      // Ya arrancó si Flutter puso su vista en la página
      if (document.querySelector('flutter-view, flt-glass-pane')) return;
      var d = document.createElement('div');
      d.id = 'carga-lenta';
      d.style.cssText = 'position:fixed;left:50%;bottom:12%;transform:translateX(-50%);' +
        'text-align:center;font-family:sans-serif;color:#ccc;font-size:14px;z-index:9999';
      d.innerHTML = 'La app está tardando en cargar…<br><br>' +
        '<button style="background:#3AF500;color:#000;border:0;border-radius:8px;' +
        'padding:12px 22px;font-weight:bold;font-size:15px" ' +
        'onclick="sessionStorage.removeItem(\'sw_recargado\');location.reload()">RECARGAR</button>';
      document.body.appendChild(d);
    }, 25000);
  </script>

  <script src="flutter_bootstrap.js" async=""></script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ServiExpress · Comparte tu ubicación</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Página que abre el CLIENTE desde el enlace de WhatsApp que le manda el
       local ("Pedir ubicación"). Guarda su GPS en el servicio a través de la
       función capturar-ubicacion de Supabase. (Supabase ya no muestra páginas
       web desde sus funciones: por eso la página vive aquí.) -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0D0D0D; color: #111;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .marca { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #3AF500; margin-bottom: 22px; }
    .card { background: #fff; border-radius: 18px; padding: 28px 22px; width: 100%; max-width: 400px; text-align: center;
      box-shadow: 0 6px 18px rgba(58,245,0,.18); }
    .icon { font-size: 52px; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; color: #111; }
    p { font-size: 16px; color: #444; line-height: 1.45; margin-bottom: 22px; }
    button { width: 100%; min-height: 56px; padding: 14px; background: #3AF500; color: #000; border: none; border-radius: 14px;
      font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    button.sec { background: #F3F4F6; color: #111; }
    button:disabled { opacity: .55; }
    .status { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 15px; font-weight: 600; display: none; line-height: 1.4; }
    .ok { background: #E8F5E9; color: #1B5E20; }
    .warn { background: #FFF7E6; color: #8A5300; }
    .err { background: #FDECEC; color: #B71C1C; }
    .orden { font-size: 13px; color: #888; margin-top: 18px; }
    .oculto { display: none; }
  </style>
</head>
<body>
  <div class="marca">⚡ ServiExpress</div>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Cargando…</h1>
    <p id="desc">Un momento, por favor.</p>
    <button id="btn" class="oculto" onclick="capturar()">📍 Enviar mi ubicación</button>
    <button id="btnIgual" class="sec oculto" onclick="enviar(mejor)">Enviar de todos modos</button>
    <div class="status" id="status"></div>
    <div class="orden" id="orden"></div>
  </div>

<script>
  var FUNCION = 'https://oukiofdtargjrclualgm.supabase.co/functions/v1/capturar-ubicacion';
  var q = new URLSearchParams(location.search);
  var ID = (q.get('id') || '').replace(/[^0-9]/g, '');
  var TOKEN = (q.get('t') || '').replace(/[^0-9a-fA-F]/g, '');
  var mejor = null, yaEnviado = false;

  function $(i) { return document.getElementById(i); }
  function pantalla(icono, titulo, texto) {
    $('icon').textContent = icono; $('title').textContent = titulo; $('desc').textContent = texto;
  }
  function msg(clase, texto) {
    var s = $('status'); s.className = 'status ' + clase; s.textContent = texto; s.style.display = 'block';
  }

  // 1) Revisar que el enlace sea válido y el pedido siga activo
  (function iniciar() {
    if (!ID || !TOKEN) { pantalla('⚠️', 'Enlace incompleto', 'Pide al local que te envíe el enlace de nuevo.'); return; }
    $('orden').textContent = 'Pedido #' + ID;
    fetch(FUNCION + '?formato=json&id=' + ID + '&t=' + TOKEN)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.estado === 'terminado') { pantalla('🏁', 'Este pedido ya terminó', 'Ya no es necesario enviar tu ubicación. ¡Gracias!'); return; }
        if (d.estado !== 'ok') { pantalla('⚠️', 'Enlace no válido', 'Pide al local que te envíe el enlace de nuevo.'); return; }
        pantalla('📍', 'Comparte tu ubicación',
          'Así el Móvil llega exactamente a donde estás. Activa el GPS de tu teléfono y toca el botón verde.');
        $('btn').classList.remove('oculto');
      })
      .catch(function () {
        pantalla('📶', 'Sin conexión', 'No pudimos cargar tu pedido. Revisa tu internet y vuelve a abrir el enlace.');
      });
  })();

  // 2) Tomar el GPS: escucha unos segundos y se queda con la lectura más precisa
  function capturar() {
    if (yaEnviado) return;
    var btn = $('btn');
    $('btnIgual').classList.add('oculto');
    if (!navigator.geolocation) { msg('err', 'Tu navegador no puede usar el GPS. Ábrelo con Chrome o Safari.'); return; }
    btn.disabled = true; btn.textContent = 'Buscando tu ubicación…';
    mejor = null;
    var inicio = Date.now(), terminado = false, watch, tope;
    function terminar() {
      if (terminado) return; terminado = true;
      clearTimeout(tope); navigator.geolocation.clearWatch(watch);
      if (!mejor) { btn.disabled = false; btn.textContent = 'Intentar de nuevo'; msg('err', 'No encontramos señal GPS. Activa el GPS e inténtalo de nuevo.'); return; }
      var acc = Math.round(mejor.coords.accuracy);
      if (acc > 150) {
        btn.disabled = false; btn.textContent = 'Intentar de nuevo';
        $('btnIgual').classList.remove('oculto');
        msg('warn', 'Tu ubicación salió poco precisa (±' + acc + ' m). Activa el GPS en "alta precisión", sal a un lugar abierto e inténtalo de nuevo.');
        return;
      }
      enviar(mejor);
    }
    watch = navigator.geolocation.watchPosition(function (pos) {
      if (!mejor || pos.coords.accuracy < mejor.coords.accuracy) mejor = pos;
      btn.textContent = 'Precisión: ±' + Math.round(mejor.coords.accuracy) + ' m…';
      if (mejor.coords.accuracy <= 20 || Date.now() - inicio > 12000) terminar();
    }, function (err) {
      terminado = true; clearTimeout(tope); navigator.geolocation.clearWatch(watch);
      btn.disabled = false; btn.textContent = '📍 Enviar mi ubicación';
      var m = { 1: 'No diste permiso de ubicación. Toca el candado de la barra de arriba, permite "Ubicación" y vuelve a intentarlo.',
                2: 'No hay señal GPS. Activa el GPS de tu teléfono.',
                3: 'Se demoró mucho. Intenta en un lugar con mejor señal.' };
      msg('err', m[err.code] || 'No se pudo usar el GPS.');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    tope = setTimeout(terminar, 13000);
  }

  // 3) Enviar la ubicación al pedido
  function enviar(pos) {
    if (!pos || yaEnviado) return;
    var btn = $('btn');
    btn.disabled = true; btn.textContent = 'Enviando…';
    $('btnIgual').classList.add('oculto');
    var acc = Math.round(pos.coords.accuracy);
    fetch(FUNCION, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ servicio_id: ID, token: TOKEN, lat: pos.coords.latitude, lng: pos.coords.longitude, precision: acc })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) throw new Error(data.error || '');
        yaEnviado = true;
        pantalla('✅', '¡Ubicación enviada!', 'El Móvil ya tiene tu ubicación. Puedes cerrar esta ventana.');
        btn.style.display = 'none';
        if (data.nivel === 'poco_precisa') msg('warn', 'Enviada, pero poco precisa (±' + acc + ' m). Puede que el Móvil te llame para confirmar.');
        else if (data.nivel === 'aproximada') msg('ok', 'Enviada · Aproximada (±' + acc + ' m)');
        else msg('ok', 'Enviada · Exacta (±' + acc + ' m)');
      })
      .catch(function () {
        msg('err', 'No se pudo enviar. Revisa tu internet y toca el botón otra vez.');
        btn.disabled = false; btn.textContent = 'Intentar de nuevo';
      });
  }
</script>
</body>
</html>
